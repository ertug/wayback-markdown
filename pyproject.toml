[project]
name = "wayback-markdown"
version = "0.1.0"
description = "A Wayback Machine -> Markdown CLI for AI coding agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "markitdown[docx,pptx,pdf]>=0.1",
]

[project.scripts]
wayback-markdown = "wayback_markdown.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wayback_markdown"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
